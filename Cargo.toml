[package]
name = "DSP-seed-forge"
version = "0.1.0"
edition = "2024"
publish = false
license = "MPL-2.0"
description = "GPU-powered seed searcher for Dyson Sphere Program"

[workspace]
exclude = ["shader"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
ash = { version = "0.38", default-features = false, features = ["std", "debug", "linked"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
pkg-config = "0.3.34"
